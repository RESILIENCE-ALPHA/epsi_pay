# Construit les images auth, payment et database puis les pousse sur GHCR.
# Tag : <AAAAMMJJ>.<n> (ex. 20261021.42), n = numéro d'exécution du workflow.
name: Build and push images

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      owner: ${{ steps.tag.outputs.owner }}
    steps:
      - id: tag
        run: |
          echo "tag=$(date -u +%Y%m%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          # GHCR exige un nom en minuscules
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            context: .
            dockerfile: auth/Dockerfile
          - service: payment
            context: .
            dockerfile: payment/Dockerfile
          - service: database
            context: ./database
            dockerfile: database/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ needs.version.outputs.owner }}/epsi-pay-${{ matrix.service }}:${{ needs.version.outputs.tag }}
            ghcr.io/${{ needs.version.outputs.owner }}/epsi-pay-${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
