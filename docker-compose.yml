version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: epsi_pay_postgres
    restart: always
    environment:
      POSTGRES_USER: epsi_pay
      POSTGRES_PASSWORD: epsi_pay_secret
      POSTGRES_DB: epsi_pay_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epsi_pay -d epsi_pay_db"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
